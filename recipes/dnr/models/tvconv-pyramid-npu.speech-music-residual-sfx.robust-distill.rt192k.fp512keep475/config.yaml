_base_: ${base_config_path}/train_base.yaml

seed: 2026

sr: 44100
n_fft: 2048
hop_length: 512
n_src: 3
n_chan: 1

teacher_checkpoint_path: null
teacher_n_fft: ${n_fft}
teacher_hop_length: ${hop_length}

tvconv_base_channels: 64
tvconv_bottleneck_channels: 160
tvconv_n_down: 4
tvconv_n_blocks: 6
tvconv_expansion: 3
tvconv_time_kernel: 3
tvconv_time_dilation_cycle: [1, 1, 2, 2, 2, 1]
tvconv_band_kernel: 3
tvconv_capacity_hidden: 0
tvconv_mask_hidden: 128
tvconv_source_kernel: 5
tvconv_real_mask_scale: 1.5
tvconv_imag_mask_scale: 0.12

trainer:
  max_epochs: 150
  check_val_every_n_epoch: 1
  gradient_clip_val: 2.0
  sync_batchnorm: True
  deterministic: false
  limit_train_batches: 1354
  limit_val_batches: 10
  benchmark: True
  use_distributed_sampler: False
  precision: bf16-mixed
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      filename: "{epoch:04d}"
      save_top_k: 5
      monitor: validation/loss
      mode: min
      save_last: True
    - _target_: lightning.pytorch.callbacks.RichProgressBar
      refresh_rate: 5
    - _target_: lightning.pytorch.callbacks.RichModelSummary
      max_depth: 3

datamodule:
  _target_: spectral_feature_compression.common.datamodules.on_the_fly_stem_datamodule.OnTheFlyStemDataModule
  source_manifest_csv:
    - /data1/manifests/train_sources.csv
  val_source_manifest_csv:
    - /data1/manifests/validation_sources.csv
  test_source_manifest_csv:
    - /data1/manifests/test_sources.csv
  batch_size: 4
  val_batch_size: 1
  test_batch_size: 1
  sr: ${sr}
  duration: 6.0
  num_workers: 4
  dataset_length: 240000
  val_dataset_length: 2000
  test_dataset_length: 2000
  train_seed: null
  val_seed: 2026
  test_seed: 2027
  source_order: [speech, music, effects]
  val_drop_last: false
  synthesis:
    backend: dry_mix
    mixture_duration: ${datamodule.duration}
    short_clip_policy: concatenate
    same_stem_placement:
      mode: random_sequential
      initial_offset_sec_range: [0.0, 0.5]
      gap_sec_range: [0.0, 0.45]
      overlap_sec_range: [0.0, 0.30]
      allow_self_overlap: true
      max_self_overlap: 2
    normalize_sources: true
    source_normalization:
      mode:
        speech: percentile_rms
        music: full_rms
        effects: percentile_rms
      target_rms:
        speech: 0.12
        music: 0.10
        effects: 0.10
      top_percent:
        speech: 35.0
        effects: 45.0
      activity_threshold_db: -48.0
      min_rms_db:
        speech: -48.0
        music: -54.0
        effects: -54.0
      max_gain_db:
        speech: 12.0
        music: 10.0
        effects: 12.0
    source_activity_threshold: 1.0e-4
    crop_retry: 8
    peak_norm_db: -1.0
    peak_norm_mode: scale_down
    synthesis_profiles:
      - name: football_commentary_focus
        weight: 0.30
        active_stem_count:
          mode: weighted
          weights:
            2: 0.35
            3: 0.65
        stem_sampling_weights:
          speech: 3.0
          music: 0.4
          effects: 3.0
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [2, 5]
        stem_gain_db:
          speech: [-3, 5]
          music: [-14, -3]
          effects: [-8, 8]
        stem_snr_db:
          enabled: true
          anchor: speech
          range:
            music: [6, 18]
            effects: [-6, 9]
      - name: live_concert_vocal_music
        weight: 0.25
        active_stem_count:
          mode: weighted
          weights:
            2: 0.25
            3: 0.75
        stem_sampling_weights:
          speech: 2.5
          music: 3.0
          effects: 1.5
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [1, 4]
        stem_gain_db:
          speech: [-6, 4]
          music: [-4, 5]
          effects: [-10, 2]
        stem_snr_db:
          enabled: true
          anchor: music
          range:
            speech: [-4, 8]
            effects: [3, 16]
      - name: karaoke_music_control
        weight: 0.20
        active_stem_count:
          mode: weighted
          weights:
            1: 0.25
            2: 0.45
            3: 0.30
        stem_sampling_weights:
          speech: 2.0
          music: 4.0
          effects: 0.8
        clips_per_active_stem:
          speech: [1, 1]
          music: [1, 1]
          effects: [1, 2]
        stem_gain_db:
          speech: [-10, 3]
          music: [-2, 5]
          effects: [-16, -2]
        stem_snr_db:
          enabled: true
          anchor: music
          range:
            speech: [-3, 12]
            effects: [8, 20]
      - name: general_cass
        weight: 0.25
        active_stem_count:
          mode: weighted
          weights:
            0: 0.01
            1: 0.16
            2: 0.34
            3: 0.49
        stem_sampling_weights:
          speech: 1.4
          music: 1.2
          effects: 1.4
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [1, 5]
        stem_gain_db:
          speech: [-8, 6]
          music: [-10, 5]
          effects: [-12, 8]
        stem_snr_db:
          enabled: true
          anchor: random_active
          range:
            speech: [-4, 10]
            music: [-8, 8]
            effects: [-10, 8]

task:
  _target_: spectral_feature_compression.core.tasks.distillation_task.TeacherStudentDistillationTask
  n_fft: ${n_fft}
  hop_length: ${hop_length}
  fs: ${sr}
  css_validation: true
  ema_weight: 0.999
  ema_update_freq: 1
  require_teacher_checkpoint: true
  teacher_checkpoint_path: ${teacher_checkpoint_path}
  teacher_css_validation: true
  teacher_loss_weight: 0.65
  mixture_consistency_weight: 0.0
  low_frequency_weight: 0.25
  low_frequency_hz: 300.0
  silent_source_weight: 0.05
  silent_source_db: -60.0
  source_activity_loss_weight: 0.16
  source_activity_db: -50.0
  source_activity_active_weight: 1.0
  source_activity_inactive_weight: 0.20
  source_order: [speech, music, effects]
  source_loss_weights:
    speech: 1.6
    music: 1.25
    effects: 0.85
  source_loss_weight_normalization: full_mean
  source_weighted_snr_loss_weight: 0.35
  explicit_source_loss_weight: 0.10
  residual_source_loss_weight: 0.20
  residual_source_index: 2
  robust_label_loss_weight: 0.20
  robust_label_loss: charbonnier
  robust_label_eps: 0.001
  complex_ri_weight: 0.45
  log_magnitude_weight: 0.2
  multi_resolution_stft_weight: 0.25
  multi_resolution_stft_resolutions:
    - [512, 128]
    - [1024, 256]
    - [2048, 512]
  transient_weight: 0.08
  teacher_mask_loss_weight: 0.15
  teacher_logit_loss_weight: 0.05
  request_model_aux: true
  require_model_aux: true
  mask_aux_alignment: shared_prefix
  mask_aux_max_frame_mismatch: 4
  distillation_band_mapping: linear
  latent_distillation_weight: 0.0
  student_latent_modules: []
  teacher_latent_modules: []
  latent_allow_missing: true
  model:
    _target_: spectral_feature_compression.core.model.proposed_separation_models.build_tvconv_pyramid_npu_separator_system
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    fs: ${sr}
    n_src: ${n_src}
    n_chan: ${n_chan}
    core_n_src: 2
    residual_source_enabled: true
    residual_source_index: 2
    base_channels: ${tvconv_base_channels}
    bottleneck_channels: ${tvconv_bottleneck_channels}
    n_down: ${tvconv_n_down}
    n_blocks: ${tvconv_n_blocks}
    expansion: ${tvconv_expansion}
    time_kernel: ${tvconv_time_kernel}
    time_dilation_cycle: ${tvconv_time_dilation_cycle}
    band_kernel: ${tvconv_band_kernel}
    capacity_hidden: ${tvconv_capacity_hidden}
    mask_hidden: ${tvconv_mask_hidden}
    source_kernel: ${tvconv_source_kernel}
    real_mask_scale: ${tvconv_real_mask_scale}
    imag_mask_scale: ${tvconv_imag_mask_scale}
    scaling: false
    freq_preprocess_enabled: true
    freq_preprocess_keep_bins: 475
    freq_preprocess_target_bins: 512
    freq_preprocess_mode: triangular
    css_segment_size: 12
    css_shift_size: 6
    css_batch_size: 1
  teacher_model:
    _target_: spectral_feature_compression.core.model.proposed_separation_models.build_source_aware_melband_roformer_teacher_system
    n_fft: ${teacher_n_fft}
    hop_length: ${teacher_hop_length}
    fs: ${sr}
    n_src: ${n_src}
    n_chan: ${n_chan}
    n_bands: 128
    d_model: 192
    n_heads: 8
    source_attention_heads: 1
    n_encoder_layers: 8
    n_decoder_layers: 4
    ffn_mult: 4
    dropout: 0.1
    conv_kernel_size: [5, 5]
    routing_kernel_size: [3, 5]
    low_freq_hz: 1000.0
    low_freq_band_fraction: 0.45
    overlap_factor: 1.5
    low_freq_overlap_factor: 2.0
    include_logmag_features: true
    masking: true
    residual_output: true
    residual_scale_init: 0.05
    mixture_consistency: true
    routing_normalization: softmax
    layer_scale_init: 0.1
    scaling: true
    css_segment_size: 12
    css_shift_size: 6
    css_batch_size: 1
    online_wrapper: false
  loss:
    _target_: spectral_feature_compression.core.loss.snr.ThresSNRLossWithInactiveSource
    solve_perm: false
    n_src: ${n_src}
    zeroref_weight: 0.1
    only_denominator: false
  optimizer_config:
    _target_: aiaccel.torch.lightning.OptimizerConfig
    optimizer_generator:
      _partial_: True
      _target_: torch.optim.AdamW
      lr: 4.e-4
      weight_decay: 1.e-2
      betas: [0.9, 0.999]
    scheduler_generator:
      _partial_: True
      _target_: spectral_feature_compression.common.lr_schedulers.warmup.WarmUpStepLR
      warmup_steps: 10000
      decay_start_step: 170000
      decay_stop_step: 280000
      step_size: 1354
      decay: 0.98
    scheduler_interval: step
