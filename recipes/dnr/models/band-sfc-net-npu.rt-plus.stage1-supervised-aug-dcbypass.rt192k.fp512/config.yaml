_base_: ../band-sfc-net-npu.rt-plus.stage1-supervised-aug.rt192k.fp512/config.yaml

# Opt-in DC-bin bypass ablation.  The wrapper saves STFT bin 0 outside the core,
# sends bins 1..1024 through the 1024 -> 512 frequency preprocessing path, and
# restores a zero DC bin before iSTFT.
task:
  model:
    dc_bypass_enabled: true
    dc_policy: zero
