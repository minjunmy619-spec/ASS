_base_: ../source-aware-melband-loco-cnb.tv-stems.robust-lowlat.distill.rt192k.fp512keep475/config.yaml

# Fixes for the first TV Loco-CNB recipe:
# 1. train on the TV on-the-fly profile instead of the inherited HDF5 DnR loader;
# 2. remove pooled capacity mixers, which add ReduceMean-heavy capacity without
#    matching separation gains in our ablations;
# 3. request real model masks for mask distillation, while keeping logit
#    distillation disabled because RoFormer and Loco-CNB use different raw-logit
#    domains.
loco_cnb_pooled_mixer_hidden_schedule: [0, 0, 0, 0]

datamodule:
  _target_: spectral_feature_compression.common.datamodules.on_the_fly_stem_datamodule.OnTheFlyStemDataModule
  source_manifest_csv:
    - /data1/manifests/train_sources.csv
  val_source_manifest_csv:
    - /data1/manifests/validation_sources.csv
  test_source_manifest_csv:
    - /data1/manifests/test_sources.csv
  batch_size: 4
  val_batch_size: 1
  test_batch_size: 1
  sr: ${sr}
  duration: 6.0
  num_workers: 4
  dataset_length: 240000
  val_dataset_length: 2000
  test_dataset_length: 2000
  train_seed: null
  val_seed: 2026
  test_seed: 2027
  source_order: [speech, music, effects]
  val_drop_last: false
  synthesis:
    backend: dry_mix
    mixture_duration: ${datamodule.duration}
    short_clip_policy: concatenate
    same_stem_placement:
      mode: random_sequential
      initial_offset_sec_range: [0.0, 0.5]
      gap_sec_range: [0.0, 0.45]
      overlap_sec_range: [0.0, 0.30]
      allow_self_overlap: true
      max_self_overlap: 2
    normalize_sources: true
    source_normalization:
      mode:
        speech: percentile_rms
        music: full_rms
        effects: percentile_rms
      target_rms:
        speech: 0.12
        music: 0.10
        effects: 0.10
      top_percent:
        speech: 35.0
        effects: 45.0
      activity_threshold_db: -48.0
      min_rms_db:
        speech: -48.0
        music: -54.0
        effects: -54.0
      max_gain_db:
        speech: 12.0
        music: 10.0
        effects: 12.0
    source_activity_threshold: 1.0e-4
    crop_retry: 8
    peak_norm_db: -1.0
    peak_norm_mode: scale_down
    synthesis_profiles:
      - name: football_commentary_focus
        weight: 0.30
        active_stem_count:
          mode: weighted
          weights:
            2: 0.35
            3: 0.65
        stem_sampling_weights:
          speech: 3.0
          music: 0.4
          effects: 3.0
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [2, 5]
        stem_gain_db:
          speech: [-3, 5]
          music: [-14, -3]
          effects: [-8, 8]
        stem_snr_db:
          enabled: true
          anchor: speech
          range:
            music: [6, 18]
            effects: [-6, 9]
      - name: live_concert_vocal_music
        weight: 0.25
        active_stem_count:
          mode: weighted
          weights:
            2: 0.25
            3: 0.75
        stem_sampling_weights:
          speech: 2.5
          music: 3.0
          effects: 1.5
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [1, 4]
        stem_gain_db:
          speech: [-6, 4]
          music: [-4, 5]
          effects: [-10, 2]
        stem_snr_db:
          enabled: true
          anchor: music
          range:
            speech: [-4, 8]
            effects: [3, 16]
      - name: karaoke_music_control
        weight: 0.20
        active_stem_count:
          mode: weighted
          weights:
            1: 0.25
            2: 0.45
            3: 0.30
        stem_sampling_weights:
          speech: 2.0
          music: 4.0
          effects: 0.8
        clips_per_active_stem:
          speech: [1, 1]
          music: [1, 1]
          effects: [1, 2]
        stem_gain_db:
          speech: [-10, 3]
          music: [-2, 5]
          effects: [-16, -2]
        stem_snr_db:
          enabled: true
          anchor: music
          range:
            speech: [-3, 12]
            effects: [8, 20]
      - name: general_cass
        weight: 0.25
        active_stem_count:
          mode: weighted
          weights:
            0: 0.01
            1: 0.16
            2: 0.34
            3: 0.49
        stem_sampling_weights:
          speech: 1.4
          music: 1.2
          effects: 1.4
        clips_per_active_stem:
          speech: [1, 2]
          music: [1, 1]
          effects: [1, 5]
        stem_gain_db:
          speech: [-8, 6]
          music: [-10, 5]
          effects: [-12, 8]
        stem_snr_db:
          enabled: true
          anchor: random_active
          range:
            speech: [-4, 10]
            music: [-8, 8]
            effects: [-10, 8]

task:
  mixture_consistency_weight: 0.0
  source_loss_weight_normalization: full_mean
  source_weighted_snr_loss_weight: 0.35
  explicit_source_loss_weight: 0.10
  residual_source_loss_weight: 0.20
  residual_source_index: 2
  teacher_mask_loss_weight: 0.15
  teacher_logit_loss_weight: 0.0
  request_model_aux: true
  require_model_aux: true
  mask_aux_alignment: shared_prefix
  mask_aux_max_frame_mismatch: 4
  distillation_band_mapping: linear
