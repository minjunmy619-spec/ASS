_base_: ../online-soft-band-query-sfc2d.rt192k.fp512keep475.causal24dim.6l.64b/config.yaml

# Proposal F: SepReformer-style early source split after SFC compression.
# Source axis is packed into channels to keep tensors 4D for export experiments.
source_split_d_model: 32
source_split_n_bands: 64
source_split_shared_layers: 1
source_split_source_layers: 2
source_split_kernel_size: [3, 3]
source_split_routing_kernel_size: [1, 3]
source_split_band_config: musical
source_split_routing_normalization: softmax

task:
  model:
    _target_: spectral_feature_compression.core.model.proposed_separation_models.build_sfc_sepreformer_multistem_system
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    fs: ${sr}
    scaling: false
    css_segment_size: 12
    css_shift_size: 6
    n_src: ${n_src}
    n_chan: ${n_chan}
    n_bands: ${source_split_n_bands}
    band_config: ${source_split_band_config}
    d_model: ${source_split_d_model}
    n_shared_layers: ${source_split_shared_layers}
    n_source_layers: ${source_split_source_layers}
    kernel_size: ${source_split_kernel_size}
    routing_kernel_size: ${source_split_routing_kernel_size}
    causal: true
    masking: true
    routing_normalization: ${source_split_routing_normalization}
    freq_preprocess_enabled: true
    freq_preprocess_keep_bins: 475
    freq_preprocess_target_bins: 512
    freq_preprocess_mode: triangular
