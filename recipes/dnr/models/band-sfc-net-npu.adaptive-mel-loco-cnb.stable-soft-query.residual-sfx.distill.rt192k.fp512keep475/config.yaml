_base_: ../band-sfc-net-npu.adaptive-mel-loco-cnb.stable-soft-query.residual-sfx.rt192k.fp512keep475/config.yaml

# Teacher-guided residual-SFX follow-up.  Use after the supervised residual-SFX
# warm start, or set pretrained_model_path explicitly when fine-tuning an
# existing student.  Set teacher_checkpoint_path before launch; the recipe fails
# fast by default rather than distilling from random teacher weights.
teacher_checkpoint_path: null
teacher_n_fft: ${n_fft}
teacher_hop_length: ${hop_length}

task:
  _target_: spectral_feature_compression.core.tasks.distillation_task.TeacherStudentDistillationTask
  fs: ${sr}
  require_teacher_checkpoint: true
  teacher_checkpoint_path: ${teacher_checkpoint_path}
  teacher_loss_weight: 0.3
  mixture_consistency_weight: 0.1
  low_frequency_weight: 0.2
  low_frequency_hz: 300.0
  silent_source_weight: 0.05
  silent_source_db: -60.0
  source_activity_loss_weight: 0.1
  source_activity_db: -50.0
  source_activity_active_weight: 1.0
  source_activity_inactive_weight: 0.25
  complex_ri_weight: 0.5
  log_magnitude_weight: 0.2
  multi_resolution_stft_weight: 0.3
  multi_resolution_stft_resolutions:
    - [512, 128]
    - [1024, 256]
    - [2048, 512]
  transient_weight: 0.05
  teacher_mask_loss_weight: 0.1
  teacher_logit_loss_weight: 0.05
  latent_distillation_weight: 0.0
  student_latent_modules: []
  teacher_latent_modules: []
  latent_allow_missing: true
  teacher_model:
    _target_: spectral_feature_compression.core.model.proposed_separation_models.build_sfc_locoformer_lite_plus_system
    n_fft: ${teacher_n_fft}
    hop_length: ${teacher_hop_length}
    fs: ${sr}
    n_src: ${n_src}
    n_chan: ${n_chan}
    n_bands: 64
    d_inner: 64
    d_model: 96
    n_layers: 4
    n_heads: 4
    attention_dim: 96
    scaling: true
    css_segment_size: 12
    css_shift_size: 6
    css_batch_size: 1
