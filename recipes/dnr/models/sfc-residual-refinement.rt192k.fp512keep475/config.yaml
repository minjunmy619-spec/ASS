_base_: ../online-soft-band-query-sfc2d.rt192k.fp512keep475.causal24dim.6l.64b/config.yaml

# Proposal G: Mamba2/TS-BSMamba2-inspired residual refinement branch.
# This keeps actual Mamba2 kernels out of the strict path and uses causal,
# dilated 2D blocks for the long temporal branch and second-stage correction.
residual_refine_d_model: 24
residual_refine_n_bands: 64
residual_refine_n_layers: 2
residual_refine_long_branch_layers: 1
residual_refine_refinement_layers: 1
residual_refine_capacity_hidden: 8192
residual_refine_capacity_layers: 4
residual_refine_kernel_size: [3, 3]
residual_refine_routing_kernel_size: [1, 3]
residual_refine_dilation_cycle: [1, 2, 4]
residual_refine_long_branch_dilation_cycle: [1, 2, 4]
residual_refine_band_config: musical
residual_refine_routing_normalization: softmax

task:
  model:
    _target_: spectral_feature_compression.core.model.proposed_separation_models.build_sfc_residual_refinement_system
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    fs: ${sr}
    scaling: false
    css_segment_size: 12
    css_shift_size: 6
    n_src: ${n_src}
    n_chan: ${n_chan}
    n_bands: ${residual_refine_n_bands}
    band_config: ${residual_refine_band_config}
    d_model: ${residual_refine_d_model}
    n_layers: ${residual_refine_n_layers}
    long_branch_layers: ${residual_refine_long_branch_layers}
    refinement_layers: ${residual_refine_refinement_layers}
    capacity_mixer_hidden: ${residual_refine_capacity_hidden}
    capacity_mixer_layers: ${residual_refine_capacity_layers}
    kernel_size: ${residual_refine_kernel_size}
    routing_kernel_size: ${residual_refine_routing_kernel_size}
    dilation_cycle: ${residual_refine_dilation_cycle}
    long_branch_dilation_cycle: ${residual_refine_long_branch_dilation_cycle}
    causal: true
    masking: true
    routing_normalization: ${residual_refine_routing_normalization}
    freq_preprocess_enabled: true
    freq_preprocess_keep_bins: 475
    freq_preprocess_target_bins: 512
    freq_preprocess_mode: triangular
