_base_: ../locoformer-small.enc-crossattn64dim.dec-crossattn64dim.musical64.learnable-query/config.yaml

# Stage 1: quality teacher with stronger waveform augmentations.
# This keeps the existing offline/chunked SFC-Locoformer teacher architecture and
# only changes the data recipe.
datamodule:
  remix_sources: true
  normalize_sources: true
  source_gain_db_min: -12.0
  source_gain_db_max: 12.0
  crop_retry: 24
  source_activity_threshold: 1.0e-4
  min_active_sources: 1
  train_augmentations:
    p_gain: 0.5
    gain_db_min: -3.0
    gain_db_max: 3.0
    p_polarity: 0.25
    p_channel_swap: 0.25
    p_time_shift: 0.25
    max_time_shift_samples: 4096
    p_pitch_time: 0.15
    pitch_time_scale_min: 0.985
    pitch_time_scale_max: 1.015
    p_random_eq: 0.35
    eq_bands: 8
    eq_gain_db_min: -2.5
    eq_gain_db_max: 2.5
    p_band_dropout: 0.1
    band_dropout_width: 0.04
