task_name: modified_deft_sc_primary_frozenuss_pretrainedsed_fusion
description: >
  SC-primary training with frozen USS. The pretrained USS model generates
  separated foreground waveforms in inference mode (eval, no_grad). Only the
  SC (PretrainedSED-fusion classifier) parameters are updated. USS acts as a
  fixed audio separator / feature extractor.

deterministic: true
manual_seed: 0

datamodule:
  module: src.datamodules.datamodule
  main: DataModule
  args:
    train_dataloader:
      batch_size: 1
      num_workers: 4
      persistent_workers: false
      dataset:
        module: src.datamodules.uss_dataset
        main: USSDataset
        args:
          base_dataset:
            args:
              config:
                mode: generate
                spatial_sound_scene:
                  duration: 6.0
                  sr: 32000
                  max_event_overlap: 3
                  max_event_dur: 6.0
                  ref_db: -55
                  foreground_dir: data/dev_set/sound_event/train
                  background_dir: data/dev_set/noise/train
                  interference_dir: data/dev_set/interference/train
                  room_config:
                    module: src.modules.spatial_audio_synthesizer.room
                    main: SofaRoom
                    args:
                      path: data/dev_set/room_ir/train
                      direct_range_ms: [6, 50]
                dupse_rate: 0.5
                dupse_min_angle: 60.0
                max_n_dupse: 2
                dupse_exclusion_folder_depth: 1
                snr_range: [5, 20]
                nevent_range: [0, 3]
                ninterference_range: [0, 2]
                inteference_snr_range: [0, 15]
                dataset_length: 10112
                shuffle_label: true
                fg_return: {dry: true, dry_channel: 0, metadata: true}
                int_return: {dry: true, dry_channel: 0, metadata: true}
                bg_return: {waveform: true}
              n_sources: 3
              label_set: dcase2026t4
              return_source: true
              label_vector_mode: stack
              silence_label_mode: zeros
              return_meta: true
    val_dataloader:
      batch_size: 1
      num_workers: 4
      persistent_workers: false
      dataset:
        module: src.datamodules.uss_dataset
        main: USSDataset
        args:
          base_dataset:
            args:
              config:
                mode: metadata
                metadata_list: data/dev_set/metadata/valid.json
                fg_return:
                  dry: true
                  dry_channel: 0
                  metadata: true
                sr: 32000
                int_return:
                  dry: true
                  dry_channel: 0
                  metadata: true
                bg_return:
                  waveform: true
              n_sources: 3
              label_set: dcase2026t4
              return_source: true
              label_vector_mode: stack
              silence_label_mode: zeros
              return_meta: true

lightning_module:
  module: src.training.lightningmodule.uss_sc_joint_model_parallel
  main: USSCSJointModelParallelLightning
  args:
    uss_device: cuda:0
    sc_device: cuda:0
    # --- Freeze configuration: USS frozen, SC trainable ---
    freeze_uss: true
    uss_eval_mode_when_frozen: true
    freeze_sc: false
    sc_eval_mode_when_frozen: true
    # --- Loss weights: SC is primary ---
    lambda_uss: 0.0
    lambda_sc: 1.0
    lambda_consistency: 0.0
    consistency_temperature: 1.0
    # --- SC update every step (no throttling) ---
    sc_update_every: 1
    # Mix clean oracle foreground rows into SC adaptation as class-boundary anchors.
    # USS estimates still provide the artifact/leakage distribution.
    clean_source_mix_prob: 0.25
    clean_source_mix_weight: 1.0
    # Also mix padded zero oracle-silence rows as clean silence anchors.
    clean_silence_mix_prob: 0.10
    clean_silence_mix_weight: 1.0
    # --- Matching config ---
    match_metric: sa_sdr
    min_match_score: -10.0
    min_match_margin: -1000000000.0
    min_energy_db: -60.0
    clean_match_score: 0.0
    clean_match_margin: 2.0
    uncertain_weight: 0.35
    use_uncertain_matches: true
    bad_match_silence_weight: 0.05
    # Treat unmatched energetic USS slots as weak silence/reject negatives.
    # max_match_score protects duplicate/over-separated target-like slots from being
    # forced to silence; only unmatched slots whose best active-reference score is
    # <= this value become silence negatives. Set weight to 0.0 to disable.
    unmatched_estimated_silence_weight: 0.10
    unmatched_estimated_min_energy_db: -60.0
    unmatched_estimated_max_match_score: -10.0
    # --- Optional USS estimate cache export for offline SC fine-tuning/debugging ---
    # When enabled, writes:
    #   <export_uss_cache_dir>/<split>/soundscape/*.wav
    #   <export_uss_cache_dir>/<split>/oracle_target/*.wav
    #   <export_uss_cache_dir>/<split>/estimate_all/<soundscape>_<slot>.wav
    #   <export_uss_cache_dir>/<split>/estimate_target/<soundscape>_<slot>_<label>.wav
    #   <export_uss_cache_dir>/<split>/manifest.csv
    # The estimate_target layout is directly usable by EstimatedSourceClassifierDataset;
    # estimate_all keeps every USS foreground slot for diagnostics/custom datasets.
    export_uss_cache: false
    export_uss_cache_dir: workspace/sc_online_uss_cache_pretrainedsed_fusion
    export_uss_cache_splits: [train, val]
    export_uss_cache_overwrite: false
    export_uss_cache_once_per_soundscape: true
    export_uss_cache_save_soundscape: true
    export_uss_cache_save_oracle: true
    export_uss_cache_save_all_estimates: true
    # --- Waveform detach: not strictly needed since USS is frozen (outputs
    #     already detached), but set true for clarity ---
    detach_waveform_for_sc: true
    # --- Pretrained checkpoints ---
    uss_pretrained_ckpt: checkpoint/modified_deft_uss_lite_6s_unified_all_features.ckpt
    uss_pretrained_strict: true
    sc_pretrained_ckpt: checkpoint/m2d_sc_stage1_pretrainedsed_fusion.ckpt
    sc_pretrained_strict: true
    # --- USS model (frozen, inference-only) ---
    uss_model:
      module: src.models.deft.unified_uss
      main: UnifiedModifiedDeFTUSS
      args:
        input_channels: 4
        output_channels: 1
        hidden_channels: 96
        n_deft_blocks: 6
        n_heads: 4
        n_foreground: 3
        n_interference: 2
        n_classes: 18
        window_size: 1024
        hop_size: 320
        time_window_size: 128
        freq_group_size: 64
        shift_windows: true
        sample_rate: 32000
        inference_chunk_seconds: 10.0
        inference_chunk_hop_seconds: 8.0
        enable_foa_spatial_features: true
        include_logmag: true
        include_aiv: true
        include_ipd: true
        spatial_feature_eps: 0.00000001
        enable_temporal_activity: true
        enable_count_head: true
        count_hidden_dim: 64
        max_count: 3
        enable_spatial_head: true
        spatial_embedding_dim: 16
        enable_residual_slots: true
        n_residual: 1
        enable_semantic_bridge: true
        embedding_dim: 256
        prototype_scale: 10.0
        use_audio_embedding: true
        use_doa_head: true
        use_spatial_conditioning: true
        predicted_spatial_prob: 1.0
        spatial_mix_fallback_prob: 0.0
        tse_condition_dim: 256
    # --- SC model (trainable, primary) ---
    sc_model:
      module: src.models.m2dat.m2d_sc
      main: M2DPretrainedSEDFusionClassifier
      args:
        weight_file:
          checkpoint/m2d_as_vit_base-80x1001p16x16p32k-240413_AS-FT_enconly/weights_ep69it3124-0.47998.pth
        num_classes: 18
        embedding_dim: 512
        m2d_embedding_dim: 512
        pooling_hidden_dim: 512
        projection_hidden_dim: 1024
        dropout: 0.2
        finetuning_layers: 2_blocks
        eval_crop_seconds: 5.0
        eval_crop_hop_seconds: 2.5
        # Bounded SC input loudness normalization for USS/TSE estimated sources.
        # Very quiet rows are left unchanged to avoid amplifying silence/leakage.
        input_rms_norm: true
        input_target_rms_db: -28.0
        input_min_rms_db: -55.0
        input_max_gain_db: 15.0
        input_min_gain_db: -12.0
        input_peak_limit: 0.98
        energy_thresholds:
          default: -3.5
        pretrainedsed_repo_root: external/PretrainedSED
        pretrainedsed_checkpoint_dir: checkpoint/pretrainedsed
        pretrainedsed_models: [BEATs, ATST-F, fpasst]
        pretrainedsed_checkpoint_variant: strong_1
        pretrainedsed_pooling: mean
        pretrainedsed_seq_len: 250
        pretrainedsed_embed_dim: 768
        pretrainedsed_download_if_missing: true
        freeze_pretrainedsed: true
        fusion_strategy: weighted_avg
        fusion_hidden_dim: 1024
        input_sample_rate: 32000
    # --- USS loss (computed for monitoring only, not for backward) ---
    uss_loss:
      module: src.training.loss.uss_bridge_loss
      main: get_loss_func
      args:
        lambda_non_foreground: 0.01
        lambda_class_pit: 0.1
        lambda_class_ce: 0.8
        lambda_count: 0.2
        lambda_inactive_foreground: 0.2
        lambda_inactive_interference: 0.01
        lambda_inactive_noise: 0.01
        lambda_activity_foreground: 0.05
        lambda_activity_interference: 0.01
        lambda_activity_noise: 0.01
        lambda_doa: 0.05
        lambda_spatial_diversity: 0.02
        lambda_waveform_anticollapse: 0.01
        lambda_bridge_proto: 0.05
        lambda_bridge_supcon: 0.02
        lambda_bridge_infonce: 0.02
        lambda_bridge_doa: 0.05
        lambda_bridge_norm: 0.001
        lambda_residual_slot: 0.05
        lambda_mix: 0.05
    # --- SC loss (primary training loss) ---
    sc_loss:
      module: src.training.loss.m2d_sc_arcface
      main: get_loss_func
      args:
        lambda_energy: 0.001
        m_in: -6.0
        m_out: -1.0
        lambda_activity: 0.0
        label_smoothing: 0.05
        robust_loss_mode: truncation
        truncation_quantile: 0.8
        truncation_warmup_epochs: 1
        truncation_drop_weight: 0.1
        min_keep_ratio: 0.5
    # --- No USS optimizer (USS is frozen) ---
    # optimizer_uss is omitted intentionally
    # --- SC optimizer (primary) ---
    optimizer_sc:
      module: torch.optim
      main: AdamW
      args:
        params:
        lr: 0.00005
        betas: [0.9, 0.999]
        eps: 0.00000001
        weight_decay: 0.01
        amsgrad: true
    is_validation: true

train:
  callbacks:
  - name: checkpoint
    module: lightning.pytorch.callbacks
    main: ModelCheckpoint
    args:
      every_n_epochs: 1
      filename: '{epoch}'
      save_top_k: 3
      save_last: true
      monitor: epoch_val/loss
      mode: min
      dirpath:
  - name: tqdm
    module: lightning.pytorch.callbacks
    main: TQDMProgressBar
    args:
      refresh_rate: 60
      process_position: 0
  trainer:
    module: lightning.pytorch
    main: Trainer
    args:
      accelerator: gpu
      devices: 1
      strategy: auto
      precision: bf16-mixed
      max_epochs: 30
      log_every_n_steps: 50
      use_distributed_sampler: false
      sync_batchnorm: false
      num_sanity_val_steps: 0
      enable_checkpointing: true
      enable_progress_bar: true
      enable_model_summary: false
      gradient_clip_val: 1.0
