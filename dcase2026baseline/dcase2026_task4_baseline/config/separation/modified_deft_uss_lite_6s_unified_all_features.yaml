task_name: modified_deft_uss_lite_6s_unified_all_features
description: 6-second memory-efficient DeFT USS using the unified opt-in class with FOA features, temporal activity, count, spatial, residual, and semantic bridge outputs.

deterministic: true
manual_seed: 0

datamodule:
  module: src.datamodules.datamodule
  main: DataModule
  args:
    train_dataloader:
      batch_size: 2
      num_workers: 2
      persistent_workers: false
      dataset:
        module: src.datamodules.uss_dataset
        main: USSDataset
        args:
          base_dataset:
            args:
              config:
                mode: generate
                spatial_sound_scene:
                  duration: 6.0
                  sr: 32000
                  max_event_overlap: 3
                  max_event_dur: 6.0
                  ref_db: -55
                  foreground_dir: data/dev_set/sound_event/train
                  background_dir: data/dev_set/noise/train
                  interference_dir: data/dev_set/interference/train
                  room_config:
                    module: src.modules.spatial_audio_synthesizer.room
                    main: SofaRoom
                    args:
                      path: data/dev_set/room_ir/train
                      direct_range_ms: [6, 50]
                dupse_rate: 0.5
                dupse_min_angle: 60.0
                max_n_dupse: 2
                dupse_exclusion_folder_depth: 1
                snr_range: [5, 20]
                nevent_range: [0, 3]
                ninterference_range: [0, 2]
                inteference_snr_range: [0, 15]
                dataset_length: 10112
                shuffle_label: true
                fg_return: {dry: true, dry_channel: 0, metadata: true}
                int_return: {dry: true, dry_channel: 0, metadata: true}
                bg_return: {waveform: true}
              n_sources: 3
              label_set: dcase2026t4
              return_source: true
              label_vector_mode: stack
              silence_label_mode: zeros
              return_meta: true
    val_dataloader:
      batch_size: 2
      num_workers: 2
      persistent_workers: false
      dataset:
        module: src.datamodules.uss_dataset
        main: USSDataset
        args:
          base_dataset:
            args:
              config:
                mode: metadata
                metadata_list: data/dev_set/metadata/valid.json
                fg_return:
                  dry: true
                  dry_channel: 0
                  metadata: true
                sr: 32000
                int_return:
                  dry: true
                  dry_channel: 0
                  metadata: true
                bg_return:
                  waveform: true
              n_sources: 3
              label_set: dcase2026t4
              return_source: true
              label_vector_mode: stack
              silence_label_mode: zeros
              return_meta: true

lightning_module:
  module: src.training.lightningmodule.uss_bridge
  main: USSBridgeLightning
  args:
    model:
      module: src.models.deft.unified_uss
      main: UnifiedModifiedDeFTUSS
      args:
        input_channels: 4
        output_channels: 1
        hidden_channels: 96
        n_deft_blocks: 6
        n_heads: 4
        n_foreground: 3
        n_interference: 2
        n_classes: 18
        window_size: 1024
        hop_size: 320
        time_window_size: 128
        freq_group_size: 64
        shift_windows: true
        sample_rate: 32000
        inference_chunk_seconds: 10.0
        inference_chunk_hop_seconds: 8.0
        enable_foa_spatial_features: true
        include_logmag: true
        include_aiv: true
        include_ipd: true
        enable_temporal_activity: true
        enable_count_head: true
        count_hidden_dim: 64
        max_count: 3
        enable_spatial_head: true
        spatial_embedding_dim: 16
        enable_residual_slots: true
        n_residual: 1
        enable_semantic_bridge: true
        embedding_dim: 256
        prototype_scale: 10.0
        use_audio_embedding: true
        use_doa_head: true
        use_spatial_conditioning: true
        predicted_spatial_prob: 0.25
        spatial_mix_fallback_prob: 0.05
        tse_condition_dim: 256
    loss:
      module: src.training.loss.uss_bridge_loss
      main: get_loss_func
      args:
        lambda_non_foreground: 0.01
        lambda_class_pit: 0.1
        lambda_class_ce: 0.8
        lambda_count: 0.2
        lambda_inactive_foreground: 0.2
        lambda_inactive_interference: 0.01
        lambda_inactive_noise: 0.01
        lambda_activity_foreground: 0.05
        lambda_activity_interference: 0.01
        lambda_activity_noise: 0.01
        lambda_doa: 0.05
        lambda_spatial_diversity: 0.02
        lambda_waveform_anticollapse: 0.01
        lambda_bridge_proto: 0.05
        lambda_bridge_supcon: 0.02
        lambda_bridge_infonce: 0.02
        lambda_bridge_doa: 0.05
        lambda_bridge_norm: 0.001
        lambda_residual_slot: 0.05
        lambda_mix: 0.05
    optimizer:
      module: torch.optim
      main: AdamW
      args:
        params:
        lr: 0.0004
        betas: [0.9, 0.999]
        eps: 0.00000001
        weight_decay: 0.0
        amsgrad: true
    is_validation: true

train:
  callbacks:
  - name: checkpoint
    module: lightning.pytorch.callbacks
    main: ModelCheckpoint
    args:
      every_n_epochs: 1
      filename: '{epoch}'
      save_top_k: 1
      save_last: true
      monitor: epoch_valid/loss
      mode: min
  - name: learning_rate_monitor
    module: lightning.pytorch.callbacks
    main: LearningRateMonitor
    args:
      logging_interval: step
  - name: spatial_conditioning_curriculum
    module: src.training.callbacks.spatial_conditioning_curriculum
    main: SpatialConditioningCurriculum
    args:
      model_attr: model
      warmup_epochs: 25
      anneal_epochs: 150
      start_predicted_spatial_prob: 0.25
      end_predicted_spatial_prob: 1.0
      start_spatial_mix_fallback_prob: 0.05
      end_spatial_mix_fallback_prob: 0.0
      strict: true
  trainer:
    module: lightning.pytorch
    main: Trainer
    args:
      max_epochs: 250
      accelerator: gpu
      devices: [0]
      precision: bf16-mixed
      accumulate_grad_batches: 4
      gradient_clip_val: 5.0
      log_every_n_steps: 20
      check_val_every_n_epoch: 1
