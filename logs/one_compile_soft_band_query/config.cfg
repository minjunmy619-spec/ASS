; ONECC config for OnlineSoftBandQuerySFC2D (non-streaming export)
; Run:
;   onecc -C /home/cmj/works/ASS/logs/one_compile_soft_band_query/config.cfg
;
; Notes:
; - This config is based on:
;   /home/cmj/works/ASS/recipes/musdb18hq/models/online-soft-band-query-sfc2d.causal96dim.12l/config.yaml
; - ONNX input:
;   /home/cmj/works/ASS/logs/one_compile_soft_band_query/nonstream_model.onnx
; - Calibration set:
;   /home/cmj/works/ASS/logs/one_compile_soft_band_query/calib.h5
;
; If you want backend codegen, set:
;   [onecc] one-codegen=True
; and fill [backend]/[one-codegen] fields for your target/backend.

[Environment]
ONECC_ENV="ONECC"

[backend]
; codename of target (used mainly with one-codegen)
target=

[onecc]
one-import-tf=False
one-import-tflite=False
one-import-bcq=False
one-import-onnx=True
one-optimize=True
one-quantize=True
one-partition=False
one-pack=False
one-codegen=False
one-profile=False
one-infer=False

; Keep empty here because this environment does not provide O1 include groups.
; (Using include=O1 caused: onecc KeyError: 'O1')

[one-import-onnx]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/nonstream_model.onnx
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.circle
unroll_rnn=False
unroll_lstm=False
; Helpful when batch is treated dynamically
dynamic_batch_to_single_batch=True

[one-optimize]
convert_nchw_to_nhwc=True
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.circle
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.opt.circle

[one-quantize]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.opt.circle
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.q.circle
input_data=/home/cmj/works/ASS/logs/one_compile_soft_band_query/calib.h5
input_data_format=h5
quantized_dtype=uint8
granularity=channel
input_type=uint8
output_type=uint8

[one-codegen]
; Enable by setting one-codegen=True in [onecc]
; Option A: use backend directly
backend=
; Option B: use [backend].target and backend command
command=-o /home/cmj/works/ASS/logs/one_compile_soft_band_query/model.npu.bin /home/cmj/works/ASS/logs/one_compile_soft_band_query/model.q.circle

