; ONECC optimization template for OnlineSoftBandQuerySFC2D
; Toggle one-optimize options in [one-optimize] section.
; Run:
;   onecc -C /home/cmj/works/ASS/logs/one_compile_soft_band_query/config_opt_template.cfg

[Environment]
ONECC_ENV="ONECC"

[backend]
target=

[onecc]
one-import-tf=False
one-import-tflite=False
one-import-bcq=False
one-import-onnx=True
one-optimize=True
one-quantize=False
one-partition=False
one-pack=False
one-codegen=False
one-profile=False
one-infer=False

[one-import-onnx]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/nonstream_model.onnx
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.circle
unroll_rnn=False
unroll_lstm=False
dynamic_batch_to_single_batch=True

[one-optimize]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.circle
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.opt.circle

; ----- General -----
convert_nchw_to_nhwc=True
common_subexpression_elimination=False
expand_broadcast_const=False

; ----- NCHW/NHWC shape options -----
; Set only if convert_nchw_to_nhwc=True and needed by your model.
nchw_to_nhwc_input_shape=
nchw_to_nhwc_output_shape=

; ----- Fold passes -----
fold_add_v2=False
fold_cast=False
fold_densify=False
fold_dequantize=False
fold_dwconv=False
fold_fully_connected=False
fold_gather=False
fold_mul=False
fold_reshape=False
fold_shape=False
fold_sparse_to_dense=False
fold_squeeze=False

; ----- Forward / canonicalize helper passes -----
forward_reshape_to_unaryop=False
forward_transpose_op=False

; ----- Fuse passes -----
fuse_add_to_fullyconnected_bias=False
fuse_add_with_conv=False
fuse_add_with_tconv=False
fuse_add_with_fully_connected=False
fuse_batchnorm_with_conv=False
fuse_batchnorm_with_dwconv=False
fuse_batchnorm_with_tconv=False
fuse_mul_to_fullyconnected_weights=False
fuse_slice_with_tconv=False
fuse_bcq=False
fuse_preactivation_batchnorm=False
fuse_mean_with_mean=False
fuse_mul_with_conv=False
fuse_mul_with_div=False
fuse_mul_with_fullyconnected=False
fuse_transpose_with_mean=False
fuse_horizontal_fc_layers=False
make_batchnorm_gamma_positive=False
fuse_activation_function=False
fuse_instnorm=False
fuse_prelu=False
fuse_gelu=False
fuse_rmsnorm=False
fuse_rsqrt=False
fuse_rope=False

; ----- Replace / transform passes -----
replace_cw_mul_add_with_depthwise_conv=False
replace_non_const_fc_with_batch_matmul=False
replace_sub_with_add=False
replace_with_fc_gelu_fc=False
transform_min_max_to_relu6=False
transform_min_relu_to_relu6=False
transform_sqrt_div_to_rsqrt_mul=False

; ----- Remove passes -----
remove_duplicate_const=False
remove_fakequant=False
remove_gather_guard=False
remove_quantdequant=False
remove_redundant_quantize=False
remove_redundant_reshape=False
remove_redundant_transpose=False
remove_unnecessary_add=False
remove_unnecessary_cast=False
remove_unnecessary_div=False
remove_unnecessary_mul=False
remove_unnecessary_reshape=False
remove_unnecessary_slice=False
remove_unnecessary_strided_slice=False
remove_unnecessary_split=False
remove_unnecessary_transpose=False

; ----- Resolve custom/former custom ops -----
resolve_customop_add=False
resolve_customop_batchmatmul=False
resolve_customop_matmul=False
resolve_customop_max_pool_with_argmax=False
resolve_customop_splitv=False
resolve_former_customop=False

; ----- Substitute passes -----
substitute_expand_dims_to_reshape=False
substitute_pack_to_reshape=False
substitute_padv2_to_pad=False
substitute_splitv_to_split=False
substitute_squeeze_to_reshape=False
substitute_strided_slice_to_reshape=False
substitute_transpose_to_reshape=False

; ----- Decompose / sequence passes -----
decompose_hardswish=False
decompose_softmax=False
unroll_unidirseqlstm=False

; ----- Other -----
shuffle_weight_to_16x1float32=False
dynamic_batch_to_single_batch=False

