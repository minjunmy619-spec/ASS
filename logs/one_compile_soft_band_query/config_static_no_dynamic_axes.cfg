; Static-shape ONECC config (no dynamic axes path)
; This uses compile-only ONNX exported with RMSNorm2d replaced by Identity
; to avoid reducer dtype conflicts in this ONE build.
;
; Run:
;   onecc -C /home/cmj/works/ASS/logs/one_compile_soft_band_query/config_static_no_dynamic_axes.cfg

[Environment]
ONECC_ENV="ONECC"

[backend]
target=

[onecc]
one-import-tf=False
one-import-tflite=False
one-import-bcq=False
one-import-onnx=True
one-optimize=True
one-quantize=False
one-partition=False
one-pack=False
one-codegen=False
one-profile=False
one-infer=False

[one-import-onnx]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/nonstream_model.static.no_rmsnorm.onnx
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.static.no_rmsnorm.circle
unroll_rnn=False
unroll_lstm=False
dynamic_batch_to_single_batch=True

[one-optimize]
convert_nchw_to_nhwc=True
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.static.no_rmsnorm.circle
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.static.no_rmsnorm.opt.circle

