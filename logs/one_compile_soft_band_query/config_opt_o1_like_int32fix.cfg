; O1-like ONECC config using int32-reduction-axes ONNX variant
; Run:
;   onecc -C /home/cmj/works/ASS/logs/one_compile_soft_band_query/config_opt_o1_like_int32fix.cfg

[Environment]
ONECC_ENV="ONECC"

[backend]
target=

[onecc]
one-import-tf=False
one-import-tflite=False
one-import-bcq=False
one-import-onnx=True
one-optimize=True
one-quantize=False
one-partition=False
one-pack=False
one-codegen=False
one-profile=False
one-infer=False

[one-import-onnx]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/nonstream_model.int32axes.onnx
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.int32axes.circle
unroll_rnn=False
unroll_lstm=False
dynamic_batch_to_single_batch=True

[one-optimize]
input_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.int32axes.circle
output_path=/home/cmj/works/ASS/logs/one_compile_soft_band_query/model.int32axes.opt.circle

; Constant folding
fold_add_v2=True
fold_cast=True
fold_densify=True
fold_dequantize=True
fold_dwconv=True
fold_fully_connected=True
fold_gather=True
fold_mul=True
fold_reshape=True
fold_shape=True
fold_sparse_to_dense=True
fold_squeeze=True

; Operator fusion
fuse_add_to_fullyconnected_bias=True
fuse_add_with_conv=True
fuse_add_with_tconv=True
fuse_add_with_fully_connected=True
fuse_batchnorm_with_conv=True
fuse_batchnorm_with_dwconv=True
fuse_batchnorm_with_tconv=True
fuse_activation_function=True
fuse_mul_to_fullyconnected_weights=True
fuse_instnorm=True
fuse_prelu=True
fuse_gelu=True
fuse_rsqrt=True
fuse_mean_with_mean=True
fuse_mul_with_conv=True
fuse_mul_with_div=True
fuse_mul_with_fullyconnected=True
fuse_transpose_with_mean=True
fuse_slice_with_tconv=True
fuse_horizontal_fc_layers=True
transform_min_max_to_relu6=True
transform_min_relu_to_relu6=True

; Remove redundant operators
remove_redundant_reshape=True
remove_redundant_transpose=True
remove_unnecessary_add=True
remove_unnecessary_cast=True
remove_unnecessary_reshape=True
remove_unnecessary_slice=True
remove_unnecessary_strided_slice=True
remove_unnecessary_split=True
remove_unnecessary_transpose=True
common_subexpression_elimination=True

; Canonicalization
resolve_customop_add=True
resolve_customop_batchmatmul=True
resolve_customop_matmul=True
resolve_customop_max_pool_with_argmax=True
resolve_customop_splitv=True
substitute_expand_dims_to_reshape=True
substitute_pack_to_reshape=True
substitute_padv2_to_pad=True
substitute_splitv_to_split=True
substitute_squeeze_to_reshape=True
substitute_strided_slice_to_reshape=True
substitute_transpose_to_reshape=True
forward_reshape_to_unaryop=True
forward_transpose_op=True
replace_non_const_fc_with_batch_matmul=True
replace_with_fc_gelu_fc=True
transform_sqrt_div_to_rsqrt_mul=True

; Keep disabled by default
convert_nchw_to_nhwc=True
expand_broadcast_const=False
nchw_to_nhwc_input_shape=
nchw_to_nhwc_output_shape=
fuse_bcq=False
fuse_preactivation_batchnorm=False
fuse_rmsnorm=False
fuse_rope=False
replace_cw_mul_add_with_depthwise_conv=False
remove_duplicate_const=False
remove_fakequant=False
remove_gather_guard=False
remove_quantdequant=False
remove_redundant_quantize=False
remove_unnecessary_div=False
remove_unnecessary_mul=False
replace_sub_with_add=False
resolve_former_customop=False
shuffle_weight_to_16x1float32=False
decompose_hardswish=False
decompose_softmax=False
unroll_unidirseqlstm=False
dynamic_batch_to_single_batch=False
make_batchnorm_gamma_positive=False

